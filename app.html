<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="app-version" content="2.4.0">
<title>생기부 도우미</title>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48 64x64">
<link rel="icon" type="image/png" sizes="256x256" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<style>
:root{--blue:#3a72f2;--blue-d:#2c5fd6;--blue-soft:#eaf1ff;--navy:#1f2b46;--green:#1f9d63;--green-d:#178452;--ink:#222;--muted:#6b7380;--line:#dde2ea;--line2:#e9edf3;--bg:#f4f6fa;--panel:#fff;--red:#e0413a;--red-soft:#fdeceb;--warn:#9a5b06;--warn-soft:#fff4dc;--ok:#1f9d63;--ok-soft:#e6f6ee}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#fff;color:var(--ink);font:14px/1.55 "Noto Sans KR","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",system-ui,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
/* ---------- 상단 ---------- */
.top{display:flex;height:46px;position:sticky;top:0;z-index:20}
.logo{width:278px;flex:none;background:#fff;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--line);cursor:pointer}
.logo .mk{width:32px;height:32px;object-fit:contain}
.logo b{font-size:18px;letter-spacing:-.5px;color:#1d2a4a}
.bluebar{flex:1;background:var(--blue);display:flex;align-items:center;gap:10px;padding:0 14px;color:#fff}
.school{border:1px solid rgba(255,255,255,.85);border-radius:4px;padding:2px 9px;font-weight:700;font-size:14px;background:rgba(255,255,255,.08)}
.who{font-size:14px;opacity:.95}
.topbtn{background:#fff;color:#33435f;border:1px solid #c9d6f5;border-radius:4px;padding:4px 11px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.topbtn:hover{background:#f2f6ff}
.dot{width:9px;height:9px;border-radius:50%;background:#aaa;display:inline-block}.dot.ok{background:#2fc27a}.dot.bad{background:#ff6b5e}.dot.wait{background:#ffc04a}
.menubar{display:flex;align-items:flex-end;gap:28px;height:42px;padding:0 0 0 296px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:46px;z-index:19}
.menubar span{padding:0 2px 9px;font-size:16px;color:#333;cursor:default}
.menubar span.on{color:var(--blue);border-bottom:3px solid var(--blue);font-weight:600}
.banner{background:var(--warn-soft);color:var(--warn);font-size:12.5px;padding:5px 14px;border-bottom:1px solid #f3e2b8;text-align:center}
/* ---------- 본문 틀 ---------- */
.frame{display:flex;min-height:calc(100vh - 88px)}
.rail{width:48px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:10px}
.rail i{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:17px;color:#4a6bb5;cursor:pointer}
.rail i.on{background:var(--blue);color:#fff}
.side{width:230px;flex:none;border-right:1px solid var(--line);background:#fff;overflow:auto;position:sticky;top:88px;height:calc(100vh - 88px)}
.grp{border-bottom:1px solid var(--line2)}
.grp>.gh{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 10px;font-weight:700;font-size:14px;cursor:pointer;color:#222}
.grp>.gh.on{background:var(--blue-soft);color:var(--blue-d)}
.grp>.gh .chev{color:#888;font-size:11px}
.grp .it{padding:6px 12px 6px 34px;font-size:13.5px;color:#444;cursor:pointer}
.grp .it:hover{color:var(--blue)}
.grp .it.on{color:var(--blue);font-weight:700}
.n{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--blue);color:#fff;font-size:11.5px;font-weight:800;margin-right:7px;flex:none}
.n.g{background:#8b95a5}
.gh .lab{display:flex;align-items:center}
main{flex:1;min-width:0;padding:16px 22px 40px;background:#fff}
/* ---------- 페이지 요소 ---------- */
.ptitle{display:flex;align-items:center;gap:12px;margin:2px 0 14px}
.ptitle .bign{width:46px;height:46px;border-radius:50%;background:var(--blue);color:#fff;font-size:23px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
.ptitle h2{margin:0;font-size:21px;letter-spacing:-.4px;border-left:4px solid var(--blue);padding-left:10px;line-height:1.1}
.ptitle p{margin:4px 0 0 14px;color:var(--muted);font-size:13px}
.ptitle .crumb{margin-left:auto;border:1px solid var(--line);border-radius:4px;padding:5px 12px;font-size:13px;color:#445;white-space:nowrap}
.subtabs{display:flex;margin:0 0 12px}
.subtabs button{border:1px solid var(--line);background:#f7f8fb;padding:7px 14px;font-size:13.5px;color:#555;border-radius:0;margin-right:-1px;cursor:pointer}
.subtabs button.on{background:#fff;color:var(--blue-d);font-weight:700;border-bottom-color:#fff;box-shadow:inset 0 2px 0 var(--blue)}
.filter{background:var(--bg);border:1px solid var(--line2);border-radius:4px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 26px;align-items:center;margin-bottom:14px}
.filter label{font-weight:600;font-size:13.5px;color:#333;display:flex;align-items:center;gap:8px}
.filter label .req{color:var(--red)}
.sechead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 8px}
.sechead h3{margin:0;font-size:16px;letter-spacing:-.3px}
.sechead .total{font-size:13px;color:#444}
.sechead .sp{flex:1}
.sp{flex:1}
.btn{border:1px solid var(--blue);background:var(--blue);color:#fff;border-radius:3px;padding:5px 12px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--blue-d)}
.btn.green{background:var(--green);border-color:var(--green)}.btn.green:hover{background:var(--green-d)}
.btn.navy{background:var(--navy);border-color:var(--navy)}
.btn.line{background:#fff;color:#33435f;border-color:#c6cfdc}.btn.line:hover{background:#f4f7fc}
.btn.red{background:#fff;color:var(--red);border-color:#f0b7b3}
.btn.sm{padding:2px 8px;font-size:12.5px}
.btn.big{padding:9px 18px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.copy{border:1px solid #c6cfdc;background:#fff;color:#33435f;border-radius:3px;padding:1px 7px;font-size:12px;cursor:pointer;white-space:nowrap}
.copy:hover{border-color:var(--blue);color:var(--blue)}
input,select,textarea{border:1px solid #c9d0db;background:#fff;border-radius:3px;padding:5px 8px}
input:focus,select:focus,textarea:focus{outline:2px solid #bcd0ff;border-color:var(--blue)}
textarea{width:100%;resize:vertical;line-height:1.65}
.panel{border:1px solid var(--line);border-radius:4px;padding:14px;background:#fff;margin-bottom:14px;min-width:0}
.panel h4{margin:0 0 10px;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel h4 small{font-weight:400;color:var(--muted);font-size:12.5px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hint{font-size:12.5px;color:var(--muted);margin:5px 0}
.empty{color:var(--muted);text-align:center;padding:36px 0}
.grid3{display:grid;grid-template-columns:190px minmax(0,1fr) minmax(0,1.15fr);gap:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:1200px){.grid3,.grid2{grid-template-columns:1fr}}
/* 표 */
.tblwrap{border:1px solid var(--line);border-top:2px solid #5c6b85;overflow:auto;max-height:68vh}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{background:#f3f5f9;color:#333;font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line);border-right:1px solid var(--line2);position:sticky;top:0;z-index:1;white-space:nowrap}
.tbl td{padding:6px;border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);vertical-align:top}
.tbl tr:hover td{background:#f8fbff}
.tbl td.c{text-align:center}
.tbl textarea{min-height:58px}
/* 학생 목록 */
.slist{border:1px solid var(--line);border-radius:4px;max-height:72vh;overflow:auto}
.stu{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line2);cursor:pointer;font-size:13.5px}
.stu:hover{background:#f6f9ff}.stu.on{background:var(--blue-soft);font-weight:700;color:var(--blue-d)}
.stu .no{width:22px;text-align:right;color:var(--muted);font-size:12px}.stu .nm{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.badge{font-size:11.5px;padding:0 6px;border-radius:9px;background:#eef1f6;color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.bad{background:var(--red-soft);color:var(--red)}
/* 체크 */
.cat{margin-bottom:10px}.cat h5{font-size:13px;margin:0 0 4px;color:#333}.cat .sub{font-size:11.5px;color:var(--muted);margin:4px 0 3px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid #cfd6e1;border-radius:14px;padding:2px 9px;font-size:12.5px;cursor:pointer;user-select:none;background:#fff}
.chip.pos.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue-d);font-weight:700}
.chip.neg.on{background:var(--red-soft);border-color:var(--red);color:var(--red);font-weight:700}
.seg{display:inline-flex;border:1px solid #c9d0db;border-radius:3px;overflow:hidden}
.seg button{border:none;padding:3px 10px;background:#fff;cursor:pointer}
.seg button+button{border-left:1px solid #c9d0db}
.seg button.on{background:var(--blue);color:#fff}
/* 기록 */
.rec{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line2)}
.rec .k{flex:none;width:28px;color:var(--muted);font-size:12px;padding-top:6px;text-align:right}
.rec .d{flex:none;width:86px;font-size:12.5px;color:#445;padding-top:6px}
.rec textarea{min-height:40px;font-size:13.5px}
.unit{font-weight:700;font-size:13px;color:var(--blue-d);margin:10px 0 2px;padding:3px 8px;background:var(--blue-soft);border-radius:3px}
.counter{font-size:12px;color:var(--muted);display:flex;gap:12px;margin-top:3px}.counter .over{color:var(--red);font-weight:600}
.warns{display:flex;flex-direction:column;gap:3px;margin-top:4px}
.warn{background:var(--warn-soft);color:var(--warn);padding:4px 8px;border-radius:3px;font-size:12px}
.dup{background:var(--red-soft);color:var(--red);padding:4px 8px;border-radius:3px;font-size:12px;font-weight:600}
.prog{font-size:13px;color:var(--blue-d);min-height:19px;margin:6px 0;font-weight:600}
.bar{height:9px;background:#e5e9f0;border-radius:5px;overflow:hidden;margin:8px 0}
.bar>div{height:100%;background:var(--blue);transition:width .3s}
.bar.ind>div{width:35%!important;animation:ind 1.2s infinite linear}
@keyframes ind{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
.stopBtn{display:none}body.busy .stopBtn{display:inline-block}
body.busy .gen{opacity:.45;pointer-events:none}
details{font-size:13px;margin-top:6px}details pre{white-space:pre-wrap;background:var(--bg);padding:8px;border-radius:4px;max-height:240px;overflow:auto}
/* 처음 화면 */
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.step{border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;gap:14px;cursor:pointer;background:#fff}
.step:hover{border-color:var(--blue);box-shadow:0 2px 10px rgba(58,114,242,.12)}
.step.next{border:2px solid var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
.step .bign{width:58px;height:58px;border-radius:50%;background:var(--blue);color:#fff;font-size:28px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
.step .bign.done{background:var(--ok)}
.step h5{margin:2px 0 4px;font-size:16px}
.step p{margin:0 0 6px;color:var(--muted);font-size:13px}
.step .st{font-size:12.5px;font-weight:700}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px;background:var(--blue);color:#fff;margin-left:6px;vertical-align:2px}
.offices{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;margin:10px 0}
.offices button{padding:10px;border:1px solid #c9d0db;background:#fff;border-radius:4px;cursor:pointer;font-weight:600}
.offices button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.welcome{max-width:920px;margin:30px auto}
/* 팝업 */
dialog{border:1px solid var(--line);border-radius:6px;width:min(640px,94vw);padding:20px}
dialog::backdrop{background:rgba(20,30,50,.35)}
#copyPop{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.96);background:#1f2b46;color:#fff;padding:18px 26px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:15px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50}
#copyPop.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#copyPop b{display:block;font-size:17px;margin-bottom:4px}
#copyPop kbd{background:#fff;color:#1f2b46;border-radius:4px;padding:1px 7px;font-weight:800;font-family:inherit}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 18px;border-radius:18px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
#toast.on{opacity:.93}
.path{font-family:Consolas,monospace;font-size:12px;background:var(--bg);padding:2px 6px;border-radius:3px;word-break:break-all}
.file{display:flex;gap:8px;align-items:center;font-size:12.5px;padding:3px 6px;border-radius:3px;background:var(--bg);margin-top:3px}
.file .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.danger{border:1px solid #f0b7b3;background:#fff8f7;border-radius:4px;padding:14px}
.chk{display:flex;gap:6px;align-items:center;font-size:13.5px;margin:4px 0;cursor:pointer}
</style>
</head>
<body>
<div class="top">
  <div class="logo" data-act="tab" data-v="home"><img class="mk" src="/icon.png" alt=""><b>생기부 도우미</b></div>
  <div class="bluebar">
    <span class="school" id="schoolPill">교육청 선택 전</span><span class="who" id="whoText"></span>
    <span class="sp"></span>
    <span class="topbtn" data-act="tab" data-v="home"><span id="dot" class="dot wait"></span><span id="statusText">AI 준비 중</span></span>
    <span class="topbtn" data-act="tab" data-v="set">⚙ 설정</span>
  </div>
</div>
<div class="menubar"><span class="on">학급담임</span><span>생활기록부 작성</span></div>
<div class="banner">⚠ AI가 만든 문장은 초안이에요. 나이스(NEIS)에 입력하기 전에 반드시 읽고 사실과 다른 부분이 없는지 확인하세요.</div>
<div class="frame">
  <div class="rail" id="rail"></div>
  <div class="side" id="side"></div>
  <main id="view"><div class="empty">불러오는 중…</div></main>
</div>
<dialog id="dlg"></dialog>
<div id="copyPop"><b>📋 복사했어요!</b>원하시는 곳에 붙여넣으세요 (<kbd>Ctrl</kbd> + <kbd>V</kbd>)</div>
<div id="toast"></div>

<script>
/* ======================================================================
   기본 데이터
   ====================================================================== */
const OFFICES=["서울특별시교육청","부산광역시교육청","대구광역시교육청","인천광역시교육청","광주광역시교육청","대전광역시교육청","울산광역시교육청","세종특별자치시교육청","경기도교육청","강원특별자치도교육청","충청북도교육청","충청남도교육청","전북특별자치도교육청","전라남도교육청","경상북도교육청","경상남도교육청","제주특별자치도교육청"];
const SUBJ_ORDER=['국어','사회','도덕','수학','과학','실과','체육','음악','미술','영어','바른 생활','슬기로운 생활','즐거운 생활'];
const SEM={'1':'1학기','2':'2학기'};
const CATS=[
 {id:'study',label:'학습 태도',pos:['수업에 집중함','적극적으로 발표함','궁금한 것을 질문함','과제를 성실히 해결함','탐구심이 강함','꼼꼼하게 정리함','창의적 아이디어가 많음','모둠 활동에서 역할을 잘 수행함','배운 것을 친구에게 잘 설명함','끈기 있게 문제를 해결함','자기 생각을 글로 잘 표현함','자료를 찾아 활용하는 능력이 좋음'],neg:['집중 시간이 짧음','과제 제출이 늦음','발표를 어려워함','기초학력 보충이 필요함','글씨·정리가 미흡함','어려운 과제를 쉽게 포기함']},
 {id:'peer',label:'교우 관계',pos:['친구를 잘 배려함','갈등을 중재함','리더십이 있음','친구들에게 신뢰받음','소외된 친구를 챙김','양보를 잘함','협력을 잘함','후배·동생을 잘 돌봄'],neg:['친구와 갈등이 잦음','교우 관계가 좁음','말이 거칠 때가 있음','자기주장이 강함','장난이 지나칠 때가 있음']},
 {id:'mind',label:'성격·정서',pos:['밝고 명랑함','차분하고 신중함','감정 조절을 잘함','자신감이 있음','유머 감각이 있음','공감 능력이 뛰어남','긍정적임','정직함','호기심이 많음'],neg:['소극적이고 수줍음이 많음','감정 기복이 있음','실수에 쉽게 위축됨','쉽게 화를 냄','타인의 시선을 많이 의식함']},
 {id:'life',label:'생활 습관·책임감',pos:['규칙을 잘 지킴','1인 1역을 성실히 수행함','정리정돈을 잘함','예절이 바름','시간 약속을 잘 지킴','학급 일에 자발적으로 참여함','공공질서를 잘 지킴','환경 보호를 실천함'],neg:['준비물을 자주 빠뜨림','정리정돈이 미흡함','지각이 잦음','규칙 준수가 부족함','수업 중 잡담이 많음']},

/* ======================================================================
   같은 문장 금지 엔진

function normT(s){return (s||'').replace(/[^가-힣A-Za-z0-9]/g,'');}
function grams(s,n){const t=normT(s),g=new Set();for(let i=0;i+n<=t.length;i++)g.add(t.slice(i,i+n));return g;}
function inter(a,b){let i=0;for(const x of a)if(b.has(x))i++;return i;}
function jac(a,b){if(!a.size||!b.size)return 0;const i=inter(a,b);return i/(a.size+b.size-i);}
function dice(a,b){if(!a.size||!b.size)return 0;return 2*inter(a,b)/(a.size+b.size);}
function sents(t){return (t||'').split(/(?<=[.!?])\s+|\n+/).map(x=>x.trim()).filter(x=>normT(x).length>=6);}
function makeIdx(items){const idx={ex:new Map(),list:[]};(items||[]).forEach(it=>addIdx(idx,it.text,it.name));return idx;}
function addIdx(idx,text,name){sents(text).forEach(s=>{const n=normT(s);if(!idx.ex.has(n))idx.ex.set(n,name);idx.list.push({g:grams(s,2),len:n.length,who:name});});}
function dupIn(idx,text){
  const out=[];
  sents(text).forEach(s=>{const n=normT(s);
    if(idx.ex.has(n)){out.push({s,who:idx.ex.get(n)});return;}
    const g=grams(s,2),tol=Math.max(4,n.length*.15);
    for(const o of idx.list){if(Math.abs(o.len-n.length)<=tol&&dice(g,o.g)>=0.9){out.push({s,who:o.who});return;}}});
  return out;
}
function sameSentences(text,others){return dupIn(makeIdx(others),text);}
function maxSim(text,others){const g=grams(text,3);let m=0,who='';others.forEach(o=>{const j=jac(g,grams(o.text,3));if(j>m){m=j;who=o.name;}});return {m,who};}
function dedupeOwn(t){const seen=new Set();return sents(t).filter(s=>{const n=normT(s);if(seen.has(n))return false;seen.add(n);return true;}).join(' ');}
function classHints(others){
  const openings=[],cnt={};
  others.forEach(o=>{if(!o.text)return;openings.push(o.text.trim().slice(0,14)+'…');
    const w=o.text.split(/\s+/),seen=new Set();for(let i=0;i+1<w.length;i++){const b=w[i]+' '+w[i+1];if(b.length>=6&&!seen.has(b)){seen.add(b);cnt[b]=(cnt[b]||0)+1;}}});
  const freq=Object.entries(cnt).filter(([,c])=>c>=2).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([b])=>b.replace(/[.,]$/,''));
  return {openings:[...new Set(openings)].slice(-8),freq};
}
function avoidBlock(lines){
  if(!lines.length)return '';if(LITE.on)lines=lines.slice(0,4);
  return `\n[피할 문장] 아래 문장은 같은 반 다른 학생에게 이미 썼으니 똑같이 쓰지 말고 표현과 내용을 다르게 쓰세요.\n${lines.slice(0,10).map(x=>'- '+x).join('\n')}`;
}
function uniqBlock(hints,avoid){
  const L=[...avoid.map(x=>`${x} (이미 다른 학생에게 쓴 문장, 절대 똑같이 쓰지 말 것)`),...hints.openings.map(x=>`${x} (이렇게 시작하지 말 것)`),...hints.freq.map(x=>`'${x}' 같은 표현`)];
  if(!L.length)return '[개별화] 이 학생만의 특징이 드러나도록 씁니다.';
  return `[다른 학생과 겹치지 않게] 같은 반 다른 학생과 똑같은 문장이 하나라도 있으면 안 됩니다. 다음은 이미 쓰인 표현이니 피하세요.\n${L.slice(0,16).map(x=>'- '+x).join('\n')}`;
}
function endDot(t){t=oneLine(t).replace(/^[\s\-•·*\d.)\]]+(?=[가-힣A-Za-z(])/,'').trim();if(t&&!/[.!?]$/.test(t))t+='.';return t;}
/* 한 문장 고쳐 쓰기 (뜻 유지) */
async function rewriteSentence(s,idx,ctx=''){
  for(let i=0;i<4;i++){
    if(stopFlag)return null;
    const out=endDot(clean(await chat([{role:'system',content:sysPrompt()},{role:'user',content:`다음 문장을 뜻은 그대로 두고 단어와 문장 구조를 바꿔 한 문장으로 다시 쓰세요.${ctx?` (${ctx})`:''} 명사형(~함.)으로 끝내고, 다시 쓴 문장만 출력하세요.\n[원래 문장] ${s}`}],null,{temperature:0.9+i*0.15,max:300})).split('\n')[0]);
    if(out&&normT(out)!==normT(s)&&!dupIn(idx,out).length)return out;
  }
  return null;
}
/* 글 안의 '같은 문장'을 모두 고쳐 쓰고, 끝까지 안 되면 그 문장을 뺀다 */
async function fixText(text,idx,ctx){
  for(let r=0;r<2;r++){
    const d=dupIn(idx,text);if(!d.length)return {text,removed:0};
    for(const {s} of d){if(stopFlag)break;const alt=await rewriteSentence(s,idx,ctx);if(alt)text=text.replace(s,alt);}
  }
  let removed=0;
  dupIn(idx,text).forEach(({s})=>{if(sents(text).length>1){text=text.replace(s,'').replace(/\s{2,}/g,' ').trim();removed++;}});
  return {text,removed};
}
/* 긴 글(행발·누가기록) 만들기 */
async function genUnique(build,others,onDelta){
  let best=null,avoid=[];const R=Math.max(0,+state.settings.retries||0),idx=makeIdx(others);
  for(let a=0;a<=R;a++){
    if(stopFlag)break;
    let text=await chat(build(a,avoid),onDelta);if(!text)continue;
    text=dedupeOwn(text);
    const d=dupIn(idx,text),sim=maxSim(text,others);
    if(!d.length&&sim.m<state.settings.docSim)return {text,flag:''};
    const score=d.length*10+sim.m;
    if(!best||score<best.score)best={text,score,d};
    avoid=[...new Set([...avoid,...d.map(x=>x.s)])].slice(-6);
  }
  if(!best)throw new Error('AI가 빈 응답을 보냈어요.');
  let text=best.text,removed=0;
  if(best.d.length)({text,removed}=await fixText(text,idx));
  const sim=maxSim(text,others);
  const flag=[removed?`다른 학생과 같은 문장 ${removed}개를 뺐어요. 내용을 보충해 주세요.`:'',sim.m>=state.settings.docSim?`${sim.who}의 글과 비슷한 편이에요(같은 문장은 없음).`:''].filter(Boolean).join(' ');
  return {text,flag};
}
/* 짧은 기록 여러 개: 같은 문장은 고쳐 쓰고 색인에 추가 */
async function uniqRecord(text,idx,owner,ctx){
  text=endDot(text);
  if(dupIn(idx,text).length){const r=await fixText(text,idx,ctx);text=r.text;}
  if(dupIn(idx,text).length){ // 고쳐 쓰기로 안 되면 새 내용으로
    for(let i=0;i<3&&dupIn(idx,text).length;i++){
      if(stopFlag)break;
      const t=endDot(clean(await chat([{role:'system',content:sysPrompt()},{role:'user',content:`다음 문장과 같은 상황을 다른 활동 장면과 다른 표현으로 새롭게 한 문장으로 쓰세요. 명사형(~함.)으로 끝내고 문장만 출력하세요.${ctx?`\n[상황] ${ctx}`:''}\n[원래 문장] ${text}`}],null,{temperature:1.1,max:300})).split('\n')[0]);
      if(t)text=t;
    }
  }
  const dup=dupIn(idx,text).length>0;
  addIdx(idx,text,owner);
  return {text,dup};
}

function clean(t){
  return t.replace(/<think>[\s\S]*?(<\/think>|$)/g,'').replace(/<\|?channel\|?>[\s\S]*?<\|?(message|channel)\|?>/g,'').replace(/\*\*/g,'')
   .replace(/^\s*(행동특성 및 종합의견|행동 누가기록|누가기록|교과학습발달상황|결과|답변)\s*[:：]\s*/,'').replace(/^["“'‘]+|["”'’]+\s*$/g,'').trim();
}
async function chat(messages,onDelta,opts={}){
  if(!aiReady())throw new Error('AI를 아직 준비하고 있어요. 처음 화면에서 진행 상태를 확인해 주세요.');
  ctrl=new AbortController();const st=state.settings;
  const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},signal:ctrl.signal,
    body:JSON.stringify({model:st.model||SETUP.model,messages,temperature:opts.temperature??+st.temperature,max_tokens:opts.max||+st.maxTokens,stream:true})});
  if(!r.ok)throw new Error((await r.text()).slice(0,300));
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='',full='';
  for(;;){
    const {done,value}=await rd.read();if(done)break;
    buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop();
    for(const line of lines){const t=line.trim();if(!t.startsWith('data:'))continue;const d=t.slice(5).trim();if(d==='[DONE]')continue;
      let j;try{j=JSON.parse(d);}catch(e){continue;}
      if(j.error)throw new Error('AI 오류: '+j.error);
      const c=j.choices?.[0]?.delta?.content;if(c){full+=c;onDelta&&onDelta(clean(full));}}
  }

}

const okey=(subj,sem)=>`${subj}|${sem}`;
function unitsOf(subj,sem){return ((state.units[subj]||{})[sem]||'').split('\n').map(x=>x.trim()).filter(Boolean);}
function slots(n,u){const base=Math.floor(n/u),ex=n%u;return Array.from({length:u},(_,i)=>base+(i<ex?1:0));}
function subjInfo(s,subj){const x=s.sub[subj]||{t:[],lv:'',memo:''};x.t=x.t||[];return x;}
function subjTraitText(s,subj){

  if(x.memo&&x.memo.trim())L.push(`- ${subj} 교사 메모: ${x.memo.trim()}`);
  const st=s.checks.filter(k=>k.startsWith('study|')).map(k=>k.split('|')[2]);if(st.length)L.push(`- 평소 학습 태도: ${st.join(', ')}`);

function obsOthers(s,key){const L=[];state.students.forEach(x=>{if(x.id===s.id)return;(x.obs[key]||[]).forEach((r,i)=>L.push({name:`${dname(x)} ${i+1}번`,text:r.text,unit:r.unit}));});return L;}
function relStds(subj,units,k){

}

문장마다 활동 장면과 표현이 서로 달라야 하고, 학생 특성이 자연스럽게 드러나야 합니다. 보완점은 노력하는 모습과 성장 가능성으로 씁니다. 이번 학생은 특히 '${OBS_FOCUS[idxOf(s)%OBS_FOCUS.length]}'이 잘 드러나게 씁니다.

function parseObs(text,units){
  const groups=units.map(()=>[]);let cur=-1;const loose=[];
  const nu=units.map(u=>normT(u.replace(/^[\d\s.()\-~]+/,'')));
  text.split('\n').forEach(raw=>{
    const line=raw.trim();if(!line)return;
    const h=line.match(/^#{1,4}\s*(.+)$/)||line.match(/^\[(.+?)\]\s*$/);
    if(h){const n=normT(h[1].replace(/^[\d\s.()\-~]+/,''));let k=nu.findIndex(x=>x&&(n.includes(x)||x.includes(n)));if(k<0)k=Math.min(cur+1,units.length-1);cur=k;return;}
    const n0=normT(line);if(nu.some(x=>x&&x===n0))return;
    const t=endDot(line.replace(/^[-•·*]\s*/,'').replace(/^\d+[.)]\s*/,''));
    if(normT(t).length<10)return;
    if(cur<0)loose.push(t);else groups[cur].push(t);
  });
  if(loose.length&&groups.every(g=>!g.length))return {groups,loose};
  return {groups,loose:[]};
}
async function genObsFor(s,subj,sem,onProg){
  const units=unitsOf(subj,sem);if(!units.length)throw new Error(`${subj} ${SEM[sem]} 단원을 먼저 입력하세요.`);
  const N=Math.max(1,+state.obsCount||20),counts=slots(N,Math.min(units.length,N)),U=units.slice(0,counts.length);
  const key=okey(subj,sem),others=obsOthers(s,key),idx=makeIdx(others);
  const avoid=shuffle(others).slice(0,8).map(o=>o.text);
  let groups=U.map(()=>[]);
  if(LITE.on){ // 가벼운 모드: 단원마다 짧게 나눠 요청 (메모리 사용 ↓)
    for(let i=0;i<U.length&&!stopFlag;i++){
      onProg&&onProg(`${U[i]} 작성 중… (${i+1}/${U.length}단원)`);
      const t=await chat(obsMsgs(s,subj,sem,[U[i]],[counts[i]],avoid.slice(0,3)),null,{max:counts[i]*150+200});
      const r=parseObs(t,[U[i]]);groups[i]=(r.groups[0].length?r.groups[0]:r.loose).slice(0,counts[i]);
    }
  }else{
    onProg&&onProg('작성 중…');
    const text=await chat(obsMsgs(s,subj,sem,U,counts,avoid),t=>onProg&&onProg(`작성 중… ${t.split('\n').filter(x=>x.trim()&&!x.startsWith('#')).length}/${N}`),{max:Math.max(2400,N*140)});
    const r=parseObs(text,U);groups=r.groups;
    if(r.loose.length){let k=0;U.forEach((u,i)=>{groups[i]=r.loose.slice(k,k+counts[i]);k+=counts[i];});}
  }
  for(let i=0;i<U.length;i++){ // 모자란 단원 채우기
    let tries=0;
    while(groups[i].length<counts[i]&&tries<2&&!stopFlag){tries++;
      const need=counts[i]-groups[i].length;onProg&&onProg(`${U[i]} 보충 중…`);
      const t=await chat([{role:'system',content:sysPrompt()},{role:'user',content:`[작성할 항목] ${subj} 교과 수업 관찰 기록\n[단원] ${U[i]}\n[학생 특성]\n${subjTraitText(s,subj)}\n[이미 쓴 문장]\n${groups[i].map(x=>'- '+x).join('\n')||'- 없음'}\n이 단원 수업에서 관찰한 이 학생의 활동과 성취를 이미 쓴 문장과 다른 내용으로 ${need}개 더 쓰세요. 한 줄에 한 문장, 명사형(~함.)으로 끝내고 번호 없이 씁니다.`}],null,{max:need*160+200});
      t.split('\n').map(x=>endDot(x.replace(/^[-•·*]\s*/,'').replace(/^\d+[.)]\s*/,''))).filter(x=>normT(x).length>=10&&!x.startsWith('#')).forEach(x=>groups[i].length<counts[i]&&groups[i].push(x));
    }
    groups[i]=groups[i].slice(0,counts[i]);
  }
  const recs=[];let n=0;
  for(let i=0;i<U.length;i++){for(const t of groups[i]){if(stopFlag)break;n++;onProg&&onProg(`같은 문장 검사 ${n}/${N}`);
    const r=await uniqRecord(t,idx,`${dname(s)} ${n}번`,`${subj} ${U[i]} 단원 수업 관찰`);recs.push({unit:U[i],text:r.text,dup:r.dup});}}
  s.obs[key]=recs;
  const k2=okey(subj,sem);if(s.fin[k2]&&!recs.some(r=>r.text===s.fin[k2].text))delete s.fin[k2];
  return recs;
}

function parseSchedule(txt){
  const y=+state.year||new Date().getFullYear();
  return (txt||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const m=l.match(/^(?:(\d{4})[-./])?(\d{1,2})[-./](\d{1,2})\s*[.)]?\s*(.*)$/);
    if(!m)return {date:'',act:l};
    const yy=m[1]?+m[1]:(+m[2]<=2?y+1:y);return {date:`${yy}-${pad2(m[2])}-${pad2(m[3])}`,act:m[4].trim()};
  });
}
function spreadDates(n){
  const y=+state.year||new Date().getFullYear(),start=new Date(y,2,10),end=new Date(y,11,15),out=[];
  for(let i=0;i<n;i++){let d=new Date(start.getTime()+(end-start)*(n===1?0.5:i/(n-1)));
    if(d.getMonth()===7)d=new Date(y,8,5); if(d.getMonth()===0)d=new Date(y,11,15);
    while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()+1);
    out.push(`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`);}
  return out;
}
function ccaPlan(sub){
  const c=state.cca[sub],N=Math.max(1,+c.count||5);
  let sch=parseSchedule(c.schedule).filter(x=>x.date).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,N);
  if(sch.length<N){const extra=spreadDates(N).filter(d=>!sch.some(x=>x.date===d)).slice(0,N-sch.length).map(d=>({date:d,act:''}));sch=[...sch,...extra].sort((a,b)=>a.date.localeCompare(b.date));}
  return sch;
}

      let r=got[k]||{name:'',content:''};
      if(!r.content){const t2=await chat([{role:'user',content:`${sp.sport} 학교스포츠클럽 ${k}차시(${phaseOf(k-1,N)}) 활동을 "활동명|활동내용" 한 줄로 쓰세요. 활동명은 명사형, 활동내용은 한 문장(~함.)입니다. 앞 차시: ${rows.slice(-3).map(x=>x.name).join(', ')}`}],null,{max:200});const p=t2.split('\n')[0].split('|');r={name:(p[0]||'').trim(),content:(p[1]||'').trim()};}
      const name=r.name||`${sp.sport} 활동`;
      const u=await uniqRecord(r.content||`${name} 활동을 함.`,idx,`${k}차시`,`${sp.sport} ${name}`);
      rows.push({name,content:u.text,dup:u.dup});
    }
    sp.rows=rows.slice();save();

}

function weekdays(from,to){const out=[];const a=new Date(from),b=new Date(to);if(isNaN(a)||isNaN(b)||a>b)return out;for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1)){const w=d.getDay();if(w&&w<6)out.push(`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`);}return out;}
function csDefaults(){const o=state.counsel.opt,y=+state.year||new Date().getFullYear();if(!o.from)o.from=`${y}-03-04`;if(!o.to)o.to=today()<`${y}-12-31`&&today()>`${y}-03-04`?today():`${y}-12-20`;}
function seedFor(mid,cat){return CS_SEEDS[mid==='집단상담'&&CS_SEEDS['집단:'+cat]?'집단:'+cat:cat]||CS_SEEDS['기타'];}
function csPlan(){
  const o=state.counsel.opt,M=Math.max(1,Math.min(500,+o.count||0));
  const pool=(o.sel&&o.sel.length?S().filter(s=>o.sel.includes(s.id)):S());if(!pool.length)throw new Error('학생 명단을 먼저 만드세요.');
  const days=weekdays(o.from,o.to);if(!days.length)throw new Error('상담 기간을 확인하세요.');
  const cats=o.cats.filter(c=>CS_AUTO.includes(c));if(!cats.length)throw new Error('상담 구분을 하나 이상 고르세요.');
  let order=[];while(order.length<M)order=order.concat(shuffle(pool));order=order.slice(0,M);
  const used=new Set(),seedUse={},rows=[];
  order.forEach((s,i)=>{
    const mid=o.parent&&i%4===3?'학부모상담':'개인상담';
    const cat=mid==='학부모상담'?pick(['학생관련상담','학습','학생관련상담','기타']):cats[i%cats.length];
    let date,t=0;do{date=pick(days);t++;}while(used.has(s.id+date)&&t<50);used.add(s.id+date);
    const seeds=seedFor(mid,cat);seedUse[cat]=(seedUse[cat]||0)+1;const seed=seeds[(seedUse[cat]-1)%seeds.length];
    const lo=Math.min(+o.minFrom||10,+o.minTo||30),hi=Math.max(+o.minFrom||10,+o.minTo||30),mins=lo+5*Math.floor(Math.random()*(Math.floor((hi-lo)/5)+1));
    rows.push({id:uid(),sid:s.id,mid,cat,seed,date,title:'',content:'',min:mins,media:o.media==='섞기'?pick(['면담','면담','면담','전화상담']):o.media});
  });
  return rows.sort((a,b)=>a.date.localeCompare(b.date));
}

`[작성할 항목] 나이스 학생상담 기록 (초등학교 담임교사)

/* ---------- ③ 교과 관찰내용관리 ---------- */
function vObs(){
  const T='교과 관찰내용관리',D='과목별로 학생 특징을 체크하면 학기당 20개씩, 단원 순서대로 학생마다 서로 다른 관찰기록을 만들어요.';
  const need=needStudents(3,T,D);if(need)return need;
  const s=ensureCur(),subj=fixSubj('obsSubj'),sem=state.ui.obsSem,key=okey(subj,sem),units=unitsOf(subj,sem),info=subjInfo(s,subj),Tr=SUBJ_TRAITS[subj]||INTEG;
  const recs=s.obs[key]||[],N=+state.obsCount||20;
  const done=S().filter(x=>(x.obs[key]||[]).length).length;
  const filter=`<div class="filter"><label><span class="req">*</span>학기<select data-bind="obsSem">${Object.entries(SEM).map(([k,v])=>`<option value="${k}" ${sem===k?'selected':''}>${v}</option>`).join('')}</select></label>
   <label><span class="req">*</span>과목<select data-bind="obsSubj">${subjects().map(x=>`<option ${x===subj?'selected':''}>${x}</option>`).join('')}</select></label>
   <label>학생당 기록 수<input type="number" min="5" max="40" data-bind="obsCount" value="${N}" style="width:70px">개</label>
   <span class="sp"></span><span class="hint" style="margin:0">이 과목 작성 완료 ${done}/${S().length}명</span></div>`;
  const unitBox=`<div class="panel"><h4>${SEM[sem]} ${subj} 단원 목록 <small>한 줄에 하나씩, 교과서 차례대로 · 모든 학생 공통</small></h4>
   <div><textarea data-bind="units" rows="6" placeholder="1. 비유하는 표현\n2. 이야기를 간추려요\n3. 짜임새 있게 구성해요">${esc((state.units[subj]||{})[sem]||'')}</textarea>
    <div class="hint">${units.length?`${units.length}개 단원 → 학생마다 ${slots(N,Math.min(units.length,N)).join('·')}개씩 단원 순서대로 만들어요.`:'단원을 입력해야 관찰기록을 만들 수 있어요.'}</div></div>
</div>`;
  const left=stuList(x=>{const n=(x.obs[key]||[]).length,d=(x.obs[key]||[]).some(r=>r.dup);return `<span class="badge">${subjInfo(x,subj).t.length}</span>${n?`<span class="badge ${d?'bad':'ok'}">${n}</span>`:''}`;});
  const mid=`<div class="panel"><h4>${s.no}번 ${esc(s.name)} · ${subj} 특징</h4>
   <div class="cat"><h5>전반적 성취</h5><span class="seg">${['상','중','하'].map(v=>`<button class="${info.lv===v?'on':''}" data-act="subjLv" data-v="${v}">${{상:'우수',중:'보통',하:'노력 필요'}[v]}</button>`).join('')}</span></div>
   <div class="cat"><h5>${subj} 특징</h5>${chipRow('',Tr.pos,'pos','강점',info.t,'subjChip')}${chipRow('',Tr.neg,'neg','보완이 필요한 점',info.t,'subjChip')}</div>
   <div class="hint" style="font-weight:700;color:#333">${subj} 관찰 메모 (선택)</div><textarea data-bind="subjMemo" rows="2" placeholder="예) 시 쓰기 단원에서 비유 표현을 특히 잘 씀">${esc(info.memo||'')}</textarea>
   <div class="row" style="margin-top:8px;justify-content:flex-end"><button class="btn line" data-act="nextStu">다음 학생 →</button></div></div>`;
  let list='';let lastU='';
  recs.forEach((r,i)=>{if(r.unit!==lastU){list+=`<div class="unit">${esc(r.unit)}</div>`;lastU=r.unit;}
    list+=`<div class="rec"><span class="k">${i+1}</span><div style="flex:1"><textarea data-bind="obsText" data-i="${i}" rows="2">${esc(r.text)}</textarea>${r.dup?'<div class="dup">⛔ 다른 기록과 똑같은 문장이에요. 고쳐 주세요.</div>':''}</div>${clipBtn(()=>r.text)}</div>`;});
  const right=`<div class="panel"><h4>${subj} 관찰기록 <small>${recs.length}/${N}개</small><span class="sp"></span>${recs.length?clipBtn(()=>recs.map(r=>oneLine(r.text)).join('\n'),'전체 복사'):''}</h4>
   <div class="row"><button class="btn gen" data-act="genObs">${recs.length?'이 학생 다시 만들기':'이 학생 만들기'}</button><button class="btn line gen" data-act="bulkObs" data-v="subj">전체 학생 · ${subj}</button><button class="btn line gen" data-act="bulkObs" data-v="all">전체 학생 · 전 과목</button><button class="btn navy stopBtn" data-act="stop">중지</button></div>
   <div id="prog" class="prog"></div>${list||'<div class="empty">아직 관찰기록이 없어요.</div>'}</div>`;
  return title(3,T,D)+filter+unitBox+`<div class="grid3">${left}${mid}${right}</div>`+nextbar(3);
}

/* ---------- ④ 교과학습발달상황(학기말종합의견) ---------- */

  const T='교과학습발달상황(학기말종합의견)',D='③ 교과 관찰내용관리에서 과목마다 1개씩 가져와요. 다른 문장으로 바꾸려면 목록에서 고르세요.';
  const need=needStudents(4,T,D);if(need)return need;
  const subj=fixSubj('finSubj'),sem=state.ui.finSem,key=okey(subj,sem),L=S();

   <label><span class="req">*</span>과목<select data-bind="finSubj">${subjects().map(x=>`<option ${x===subj?'selected':''}>${x}</option>`).join('')}</select></label>
   <span class="sp"></span><button class="btn" data-act="finAuto" data-v="subj">이 과목 자동으로 가져오기</button><button class="btn line" data-act="finAuto" data-v="all">전 과목 자동으로 가져오기</button></div>
   ${has?'':`<div class="panel empty">${subj} ${SEM[sem]} 관찰기록이 아직 없어요. ③ 교과 관찰내용관리에서 먼저 만드세요. <button class="btn" data-act="tab" data-v="obs">③으로 가기</button></div>`}
   <div class="sechead"><h3>${subj} 교과학습발달상황 - ${SEM[sem]} 학기말 종합의견</h3><span class="total">Total ${texts.filter(Boolean).length}</span><span class="sp"></span><button class="btn green" data-act="copy" data-i="${ai}">📋 전체 복사(번호순)</button></div>
   <div class="tblwrap"><table class="tbl"><thead><tr><th style="width:56px">번호</th><th style="width:100px">성명</th><th style="width:30%">관찰기록에서 고르기</th><th>학기말 종합의견</th><th style="width:70px">글자수</th><th style="width:70px">복사</th></tr></thead><tbody>
   ${L.map((s,i)=>{const recs=s.obs[key]||[],f=s.fin[key]||{},t=f.text||'';
     return `<tr><td class="c">${s.no}</td><td>${esc(dname(s))}</td><td>${recs.length?`<select data-bind="finPick" data-id="${s.id}" style="width:100%"><option value="">선택하세요</option>${recs.map((r,k)=>`<option value="${k}" ${r.text===t?'selected':''}>${k+1}. [${esc(r.unit.slice(0,10))}] ${esc(r.text.slice(0,40))}…</option>`).join('')}</select>`:'<span class="hint">관찰기록 없음</span>'}</td>
     <td><textarea data-bind="finText" data-id="${s.id}" rows="2">${esc(t)}</textarea>${dupFlags[i]?'<div class="dup">⛔ 다른 학생과 똑같은 문장이에요.</div>':''}</td><td class="c">${lenOf(t)}</td><td class="c">${t?clipBtn(()=>s.fin[key]?.text||''):''}</td></tr>`;}).join('')}

function categories(){
  const L=S(),cats=[];
  cats.push({key:'hb',label:'행동특성및종합의견',items:L.filter(s=>s.hb&&s.hb.text).map(s=>({owner:dname(s),get:()=>s.hb.text,set:t=>{s.hb.text=t;}}))});
  cats.push({key:'nu',label:'행동 누가기록',items:L.flatMap(s=>s.nu.filter(n=>n.text).map(n=>({owner:`${dname(s)}(${n.date})`,get:()=>n.text,set:t=>{n.text=t;}})))});
  const okeys=[...new Set(state.students.flatMap(s=>Object.keys(s.obs).filter(k=>s.obs[k].length)))].sort();
  okeys.forEach(k=>{const [sub,sem]=k.split('|');cats.push({key:'obs'+k,label:`교과 관찰 ${sub}(${SEM[sem]})`,items:L.flatMap(s=>(s.obs[k]||[]).map((r,i)=>({owner:`${dname(s)} ${i+1}번`,get:()=>r.text,set:t=>{r.text=t;r.dup=false;}})))});});
  const fkeys=[...new Set(state.students.flatMap(s=>Object.keys(s.fin).filter(k=>s.fin[k].text)))].sort();
  fkeys.forEach(k=>{const [sub,sem]=k.split('|');cats.push({key:'fin'+k,label:`학기말종합의견 ${sub}(${SEM[sem]})`,items:L.filter(s=>s.fin[k]&&s.fin[k].text).map(s=>({owner:dname(s),get:()=>s.fin[k].text,set:t=>{s.fin[k].text=t;}}))});});
  ['auto','club','career'].forEach(c=>cats.push({key:'cca'+c,label:`창체 ${CCA[c].label}`,items:L.flatMap(s=>s.cca[c].recs.map(r=>({owner:`${dname(s)}(${r.date})`,get:()=>r.text,set:t=>{r.text=t;r.dup=false;}})))}));
  cats.push({key:'sp',label:'스포츠클럽',items:state.sports.rows.map((r,i)=>({owner:`${i+1}차시`,get:()=>r.content,set:t=>{r.content=t;r.dup=false;}}))});

  return cats;
}
function dupReport(){
  const rep=[];
  categories().forEach(c=>{const idx=makeIdx([]);c.items.forEach(it=>{dupIn(idx,it.get()).forEach(d=>rep.push({cat:c.label,item:it,c,s:d.s,who:d.who}));addIdx(idx,it.get(),it.owner);});});
  return rep;
}
async function autoFixAll(){
  let fixed=0;
  for(let pass=0;pass<3;pass++){
    const rep=dupReport();if(!rep.length)break;const seen=new Set();
    for(const r of rep){if(stopFlag)return fixed;if(seen.has(r.item))continue;seen.add(r.item);prog(`같은 문장 고치는 중: ${r.item.owner}`);
      const others=r.c.items.filter(o=>o!==r.item).map(o=>({name:o.owner,text:o.get()}));const {text}=await fixText(r.item.get(),makeIdx(others));r.item.set(text);fixed++;save();}
  }
  return fixed;
}

async function downloadPost(url,body,name){
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){alert('파일을 만들지 못했어요: '+(await r.text()));return;}
  const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('내려받았어요. 다운로드 폴더를 확인하세요.');
}

  restore:()=>{const f=$('fileRestore');f.onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const j=JSON.parse(await file.text());if(!Array.isArray(j.students))throw 0;if(!confirm(`${j.students.length}명의 백업으로 바꿀까요?`))return;adopt(j);await flush();location.reload();}catch(err){alert('백업 파일을 읽을 수 없어요.');}};f.click();},
  bench:async()=>{const o=$('benchOut');if(!aiReady()){toast('AI를 먼저 준비해야 해요');return;}o.textContent='재는 중… (처음엔 모델을 불러오느라 더 걸려요)';try{const r=await fetch('/api/bench');if(!r.ok)throw new Error(await r.text());BENCH=await r.json();}catch(e){BENCH={error:e.message};}const o2=$('benchOut');if(o2)o2.innerHTML=benchText(BENCH);},
  pickModel:async el=>{const k=el.dataset.v;if(k==='ex12'&&!confirm('초경량 모델(EXAONE 4.0 1.2B, LG AI연구원)은 약 0.8GB로 표준보다 3~4배 가볍고 빨라요.\n대신 문장 표현이 단순할 수 있어요. 아직 이 프로그램에서 충분히 검증하지 못한 시험판이라, 문장이 이상하면 표준 모델로 되돌리세요.\n\n바꿀까요?'))return;if(k!=='ex12'&&!confirm(k==='e4b'?'고성능 모델(약 5GB)을 내려받을까요? 문장 품질은 좋아지지만 만드는 속도는 조금 느려질 수 있어요.':'표준 모델(약 3.2GB)로 바꿀까요?'))return;
    const r=await fetch('/api/model',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:k})});if(!r.ok){alert(await r.text());return;}
    SETUP=null;toast('모델을 준비하고 있어요. 처음 화면에서 진행 상황을 볼 수 있어요.');setTimeout(pollSetup,600);state.tab='home';render();},
  liteMode:async el=>{try{LITE=await (await fetch('/api/lite',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:el.dataset.v})})).json();}catch(e){}render();toast(LITE.on?'가벼운 모드를 켰어요':'가벼운 모드를 껐어요');},
  saveLLM:async()=>{const base=$('llmBase').value.trim(),model=$('llmModel').value.trim();if(base&&!model){alert('모델 이름을 입력하세요.');return;}
    await fetch('/api/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({llmBase:base,model:base?model:''})});INFO=await getJSON('/api/info');SETUP=null;pollSetup();toast('적용했어요');},
  addStd:()=>{const cs=state.ui.stdSubj||subjects()[0],arr=state.customStd[cs]=state.customStd[cs]||[];let n=0;
    $('stdPaste').value.split('\n').forEach(l=>{const m=l.trim().match(/^\[?\s*(\d[가-힣]{1,2}\d{2}-\d{2})\s*\]?\s*(.+)$/);if(m&&!stdList(cs).some(x=>x[0]===m[1])){arr.push([m[1],m[2].trim()]);n++;}});
    save();render();toast(n?`${n}개 추가`:'형식에 맞는 줄이 없어요');},
  clearStd:()=>{const cs=state.ui.stdSubj||subjects()[0];if(confirm('추가한 성취기준을 지울까요?')){delete state.customStd[cs];save();render();}},
  wipe:async()=>{if(confirm('학생 데이터를 모두 지울까요? (지우기 전에 백업을 한 번 남겨 둬요)')){await flush();await fetch('/api/backup',{method:'POST'});window._wiping=true;await fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:'null'});location.reload();}},
  resetAll:async()=>{
    const delB=$('resetBackups').checked;
    const typed=prompt(`모든 데이터를 지우고 처음 상태로 되돌릴까요?${delB?'\n백업 파일도 모두 지워져서 되돌릴 수 없어요.':'\n초기화 직전 백업은 하나 남겨 둬요.'}\n\n계속하려면 아래 칸에 초기화 라고 입력하세요.`);
    if(typed===null)return;if(typed.trim()!=='초기화'){alert('"초기화"라고 입력해야 진행돼요.');return;}
    clearTimeout(saveT);await flush();window._wiping=true;
    try{const r=await fetch('/api/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({backups:delB})});if(!r.ok)throw new Error(await r.text());
      const j=await r.json();alert(j.backup?'초기화했어요. 초기화 전 데이터는 백업 폴더에 남겨 뒀어요.':'초기화했어요.');}
    catch(e){window._wiping=false;alert('초기화하지 못했어요: '+e.message);return;}
    location.reload();
  },
  uninstall:async()=>{
    const opt={data:$('unData').checked,model:$('unModel').checked,ollama:$('unOllama').checked,self:$('unSelf').checked};
    if(!Object.values(opt).some(Boolean)){alert('지울 항목을 하나 이상 고르세요.');return;}
    const what=[opt.data&&'학생 데이터·백업',opt.model&&'AI 모델',opt.ollama&&'Ollama',opt.self&&'프로그램 파일'].filter(Boolean).join(', ');
    const typed=prompt(`정말 지울까요? (${what})\n지운 뒤에는 되돌릴 수 없어요.\n\n계속하려면 아래 칸에 삭제 라고 입력하세요.`);
    if(typed===null)return;if(typed.trim()!=='삭제'){alert('"삭제"라고 입력해야 지울 수 있어요.');return;}
    window._wiping=true;
    try{const r=await fetch('/api/uninstall',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(opt)});if(!r.ok)throw new Error(await r.text());}catch(e){window._wiping=false;alert('삭제하지 못했어요: '+e.message);return;}
    document.body.innerHTML=`<div style="max-width:560px;margin:120px auto;text-align:center;font-family:inherit"><h2>생기부 도우미를 삭제했어요</h2><p style="color:#666">${esc(what)}을(를) 지웠어요. 이 창을 닫으세요.${opt.ollama?'<br>Ollama 제거는 잠시 뒤 마무리돼요.':''}</p></div>`;
  },
};
const AF=(o,k,v)=>{o[k]=v;};
const BIND={
  name:el=>{byId(el.dataset.id).name=el.value.trim();save();},
  gender:el=>{byId(el.dataset.id).gender=el.value;save();},
  memo:el=>{curS().memo=el.value;save();},
  hbText:el=>{const s=curS();s.hb=s.hb||{text:'',flag:''};s.hb.text=el.value;s.hb.flag='';save();$('hbMeta').innerHTML=metaHtml(el.value,state.settings.len.hb,s,sameSentences(el.value,hbOthers(s)),'');},
  nuText:el=>{const s=curS(),n=s.nu.find(x=>x.id===el.dataset.nid);n.text=el.value;n.flag='';save();$('nm_'+n.id).innerHTML=metaHtml(n.text,state.settings.len.nu,s,sameSentences(n.text,nuOthers(n.id)),'');},
  obsSem:el=>{state.ui.obsSem=el.value;save();render();},
  obsSubj:el=>{state.ui.obsSubj=el.value;save();render();},
  obsCount:el=>{state.obsCount=Math.max(5,Math.min(40,+el.value||20));save();},
  units:el=>{const sub=state.ui.obsSubj;state.units[sub]=state.units[sub]||{'1':'','2':''};state.units[sub][state.ui.obsSem]=el.value;save();},
  subjMemo:el=>{const s=curS(),x=s.sub[state.ui.obsSubj]=subjInfo(s,state.ui.obsSubj);x.memo=el.value;save();},
  obsText:el=>{const s=curS(),r=(s.obs[okey(state.ui.obsSubj,state.ui.obsSem)]||[])[+el.dataset.i];if(r){r.text=el.value;r.dup=false;save();}},
  finSem:el=>{state.ui.finSem=el.value;save();render();},
  finSubj:el=>{state.ui.finSubj=el.value;save();render();},
  finPick:el=>{const s=byId(el.dataset.id),key=okey(state.ui.finSubj,state.ui.finSem),recs=s.obs[key]||[];if(el.value==='')delete s.fin[key];else s.fin[key]={text:recs[+el.value].text,src:+el.value};save();render();},
  finText:el=>{const s=byId(el.dataset.id),key=okey(state.ui.finSubj,state.ui.finSem);s.fin[key]={...(s.fin[key]||{}),text:el.value};save();},
  ccaSchedule:el=>{state.cca[state.ui.ccaSub].schedule=el.value;save();},
  ccaCount:el=>{state.cca[state.ui.ccaSub].count=Math.max(1,Math.min(15,+el.value||5));save();render();},
  ccaNote:el=>{byId(el.dataset.id).cca[state.ui.ccaSub].note=el.value;save();},
  ccaText:el=>{const r=byId(el.dataset.id).cca[state.ui.ccaSub].recs[+el.dataset.i];if(r){r.text=el.value;r.dup=false;save();}},
  clubName:el=>{state.cca.club.clubs.find(c=>c.id===el.dataset.cid).name=el.value;save();},
  clubDesc:el=>{state.cca.club.clubs.find(c=>c.id===el.dataset.cid).desc=el.value;save();},
  clubPick:el=>{byId(el.dataset.id).cca.club.clubId=el.value;save();},
  sp:el=>{state.sports[el.dataset.k]=el.dataset.k==='sessions'?(+el.value||1):el.value;save();},
  spName:el=>{state.sports.rows[+el.dataset.i].name=el.value;save();},
  spContent:el=>{const r=state.sports.rows[+el.dataset.i];r.content=el.value;r.dup=false;save();},
  cso:el=>{const k=el.dataset.k;state.counsel.opt[k]=['count','minFrom','minTo'].includes(k)?(+el.value||0):el.value;save();},
  csParent:el=>{state.counsel.opt.parent=el.checked;save();},
  cs:el=>{const r=state.counsel.rows[+el.dataset.i],k=el.dataset.k;r[k]=k==='min'?(+el.value||0):el.value;if(k==='content')r.dup=false;
    if(k==='mid'){r.cat=CS_MID[r.mid][0];save();render();return;}save();},
  office:el=>{state.office=el.value;save();render();},
  top:el=>{state[el.dataset.k]=el.value;save();if(el.tagName==='SELECT')render();else{$('whoText').textContent=`${state.year}학년도 ${state.grade}학년 ${state.cls}반 담임`;}},
  schoolRules:el=>{state.settings.schoolRules=el.value;save();},
  set:el=>{const k=el.dataset.k;state.settings[k]=+el.value||DEF_SETTINGS[k];save();},
  len:el=>{state.settings.len[el.dataset.k]=+el.value||DEF_SETTINGS.len[el.dataset.k];save();},
  stdSubj:el=>{state.ui.stdSubj=el.value;save();render();},
};

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&ACT[el.dataset.act]){e.preventDefault();ACT[el.dataset.act](el,e);}});
const isToggle=el=>el.type==='checkbox'||el.tagName==='SELECT'||el.type==='date';
document.addEventListener('input',e=>{const el=e.target.closest('[data-bind]');if(el&&!isToggle(el))BIND[el.dataset.bind]?.(el);});
document.addEventListener('change',e=>{const el=e.target.closest('[data-bind]');if(el&&isToggle(el))BIND[el.dataset.bind]?.(el);});
document.addEventListener('focusout',e=>{const el=e.target;if(el.dataset&&['ccaSchedule','units'].includes(el.dataset.bind)&&!busy)render();});

/* ======================================================================
   시작
   ====================================================================== */
(async function boot(){
  try{
    [RULES,STD,INFO]=await Promise.all([getJSON('/data/rules.json'),getJSON('/data/standards.json'),getJSON('/api/info')]);
    adopt(await getJSON('/api/state'));
    try{LITE=await getJSON('/api/lite');}catch(e){}
    getJSON('/api/spec').then(x=>{SPEC=x;const sb=$('specBox');if(sb)sb.innerHTML=specHtml();}).catch(()=>{});
  }catch(e){$('view').innerHTML=`<div class="panel empty">프로그램과 연결할 수 없어요. 생기부 도우미를 다시 실행해 주세요.<br><span class="hint">${esc(e.message)}</span></div>`;return;}
  ensureCur();render();pollSetup();
  setInterval(()=>fetch('/api/ping').catch(()=>{}),60000);
  setInterval(async()=>{try{INFO=await getJSON('/api/info');const v=INFO.update&&INFO.update.versions;if(v&&RULES&&v['rules.json']!==RULES.version){RULES=await getJSON('/data/rules.json');toast('기재요령이 최신 버전으로 업데이트됐어요');}if(v&&STD&&v['standards.json']!==STD.version)STD=await getJSON('/data/standards.json');}catch(e){}},300000);
})();
</script>
</body>
